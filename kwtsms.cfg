# kwtSMS notification commands for Nagios Core 4.
# Copy to /usr/local/nagios/etc/objects/kwtsms.cfg (or /etc/nagios4/conf.d/) and add a cfg_file line for it.
# Needs kwtsms-cli in /usr/local/bin and /etc/kwtsms/kwtsms-cli.toml readable by the nagios user only (0600).
# Keep illegal_macro_output_chars in nagios.cfg at its default (`~$&|'"<>) so plugin output cannot break the quotes.

define command {
    command_name    notify-host-by-kwtsms
    command_line    /usr/local/bin/kwtsms-cli --config /etc/kwtsms/kwtsms-cli.toml send --to "$CONTACTPAGER$" --message "$NOTIFICATIONTYPE$: $HOSTNAME$ is $HOSTSTATE$ $SHORTDATETIME$ $HOSTOUTPUT$"
}

define command {
    command_name    notify-service-by-kwtsms
    command_line    /usr/local/bin/kwtsms-cli --config /etc/kwtsms/kwtsms-cli.toml send --to "$CONTACTPAGER$" --message "$NOTIFICATIONTYPE$: $SERVICEDESC$ on $HOSTNAME$ is $SERVICESTATE$ $SHORTDATETIME$ $SERVICEOUTPUT$"
}

