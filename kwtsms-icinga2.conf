// kwtSMS notification commands for Icinga 2.
// Copy to /etc/icinga2/conf.d/kwtsms.conf, then: icinga2 daemon -C && systemctl reload icinga2
// Needs kwtsms-cli in /usr/local/bin and /etc/kwtsms/kwtsms-cli.toml readable by the icinga user only (0600).
// Arguments are passed without a shell, so plugin output cannot break the command line.

object NotificationCommand "kwtsms-host-notification" {
  command = [ "/usr/local/bin/kwtsms-cli", "--config", "/etc/kwtsms/kwtsms-cli.toml", "send" ]
  arguments = {
    "--to" = "$user.pager$"
    "--message" = "$notification.type$: $host.display_name$ is $host.state$ $icinga.short_date_time$ $host.output$"
  }
}

object NotificationCommand "kwtsms-service-notification" {
  command = [ "/usr/local/bin/kwtsms-cli", "--config", "/etc/kwtsms/kwtsms-cli.toml", "send" ]
  arguments = {
    "--to" = "$user.pager$"
    "--message" = "$notification.type$: $service.display_name$ on $host.display_name$ is $service.state$ $icinga.short_date_time$ $service.output$"
  }
}

